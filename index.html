:root{
  --bg:#F9F5EF; --surface:#FFFFFF; --ink:#381932; --ink-soft:#64485d; --accent:#670626; --accent-ink:#FFF3E6;
  --gold:#B48A4E; --gold-soft:#E2C589; --line:#E7DCCB; --plaque:#EFE0BD; --plaque-ink:#3f2a12;
  --f-head:'Masvol','Cormorant Garamond',Georgia,serif;
  --f-num:'Adderley','Oswald',Impact,sans-serif;
  --f-ui:'Gilroy','Manrope',system-ui,sans-serif;
  --f-body:'Manrope',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2b1227; --surface:#381932; --ink:#FFF3E6; --ink-soft:#e5d3dc; --accent:#F3D78C; --accent-ink:#2b1227;
    --line:#5a3552; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2b1227; --surface:#381932; --ink:#FFF3E6; --ink-soft:#e5d3dc; --accent:#F3D78C; --accent-ink:#2b1227;
  --line:#5a3552; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
p{margin:0 0 14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:30px 22px 64px}
.brand{font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);text-align:center;margin:0 0 26px}
.screen{display:none}
.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}}
h1{font-family:var(--f-num);font-weight:normal;font-size:clamp(46px,13vw,72px);line-height:.95;text-align:center;margin:0 0 18px;letter-spacing:.01em}
h2{font-family:var(--f-head);font-weight:normal;font-size:clamp(30px,8vw,40px);line-height:1.12;text-align:center;margin:0 0 26px}
.lead{text-align:center;color:var(--ink-soft);max-width:30em;margin:0 auto 28px}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 auto 30px;max-width:420px}
.minis img{aspect-ratio:3/4;object-fit:cover;border:4px solid var(--gold-soft);outline:1px solid var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:14px 22px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-ui);font-size:18px;cursor:pointer;text-decoration:none;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--gold)}
.step{font-family:var(--f-ui);font-size:14px;color:var(--gold);text-align:center;letter-spacing:.06em;margin:0 0 10px}
.bar{height:3px;background:var(--line);margin:0 0 30px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s ease}
.opts{display:grid;gap:12px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;cursor:pointer;transition:border-color .15s ease}
.opt:hover{border-color:var(--gold)}
.opt b{display:block;font-family:var(--f-ui);font-weight:normal;font-size:19px;line-height:1.25}
.opt span{display:block;font-size:14.5px;color:var(--ink-soft);margin-top:4px}
.back{display:block;margin:22px auto 0;background:none;border:0;color:var(--ink-soft);font-size:14px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--gold-soft);text-underline-offset:3px}
/* result */
.museum{width:min(80vw,330px);margin:4px auto 0}
.frame{padding:14px;background:linear-gradient(145deg,#e9cf95 0%,#b48a4e 28%,#f1dca8 52%,#9a733b 76%,#e2c589 100%)}
.frame img{width:100%;border:6px solid #f3e4c4;outline:1px solid #7d5a2c}
.plaque{width:min(72vw,280px);margin:-2px auto 0;background:var(--plaque);color:var(--plaque-ink);border:1px solid #a98448;padding:10px 12px 9px;text-align:center}
.plaque small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.2em}
.plaque strong{display:block;font-family:var(--f-head);font-weight:normal;font-size:24px;line-height:1.15;margin-top:3px}
.tagline{font-family:var(--f-head);font-size:clamp(25px,6.6vw,31px);line-height:1.2;text-align:center;margin:28px 0 24px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 22px;margin:0 0 16px}
.card h3{font-family:var(--f-ui);font-weight:normal;font-size:16px;color:var(--gold);letter-spacing:.04em;margin:0 0 10px}
.card ol{margin:0;padding-left:20px}
.card ol li{margin-bottom:8px}
.remember{font-family:var(--f-head);font-size:24px;line-height:1.25;text-align:center;margin:26px 0 30px}
.goal{font-size:15.5px;color:var(--ink-soft);border-left:2px solid var(--gold-soft);padding-left:14px;margin:0 0 16px}
.tg{background:var(--surface);border:1px solid var(--gold);border-radius:6px;padding:26px 22px 22px;margin:26px 0 14px;text-align:center}
.tg .t{font-family:var(--f-head);font-size:27px;line-height:1.15;margin:0 0 10px}
.tg p{color:var(--ink-soft);font-size:15.5px;margin:0 0 18px}
.share{text-align:center;font-size:15px;color:var(--ink-soft);margin:22px 0 10px}
.fine{text-align:center;font-size:12.5px;color:var(--ink-soft);opacity:.85;margin-top:30px}
.row{display:grid;gap:12px}
</style>
</head>

    },
    vibe:{
      name:"Вайб-инвесторка",
      alt:"Эмили Купер",
      tag:"Покупаю сердцем, учусь на ошибках",
      text:["Ты уже в рынке, а это смелее, чем у большинства. Купила, потому что все брали. Потом — потому что красиво растёт. Потом — блогер хвалил. Иногда даже срабатывает.","Вайб-кодеры пишут код по ощущениям, а ты так же собираешь портфель. Весело, пока рынок не решит проверить твои нервы."],
      steps:["Посчитай свою цифру свободы: годовые расходы × 25. Это примерная сумма капитала, которая сможет покрывать твои расходы. С ней у портфеля появляется цель: видно, сколько уже собрано и сколько осталось.","Реши, сколько и как часто пополняешь портфель. Скучная регулярность обычно обгоняет удачные угадывания. Сколько инструментов держать и как собрать портфель без хаоса, разбираю в досье ниже.","Проверяй котировки раз в месяц. Ежедневный мониторинг — тот же шопинг в режиме «я просто посмотреть»."],
      remember:"Вайб оставь, просто давай добавим ему чёткий план."
    },
    quiet:{
      name:"Тихая роскошь",
      alt:"Лили ван дер Вудсен",
      tag:"Капитал любит тишину",
      text:["У тебя есть цель, план и капитал, который растёт без лишнего шума. Ты не рассказываешь, сколько у тебя есть, — ты спокойно выбираешь. Это и есть роскошь.","Дальше скорость решает одно: сколько кирпичей ты подвозишь. Сложный процент работает как кран, а материалы для стройки — твой активный доход."],
      steps:["Найди одну точку роста дохода: навык, проект, разговор о повышении.","Договорись с собой: часть каждой прибавки сразу уходит в капитал, пока её не съело «я заслужила».","Разведи подушку и капитал по разным счетам — так спокойнее держать курс. Какие счета открыть и как их назвать, пошагово в досье ниже."],
      remember:"Капитал любит тишину. И даёт право выбирать."
    }
  };
  var GOALS = {
    freedom:"Ты выбрала свободу выбора. Свой капитал — самый короткий путь к ней.",
    calm:"Ты выбрала спокойствие. Подушка — первый кирпич, капитал — весь дом.",
    dream:"Ты выбрала большую мечту. Мечта с планом и цифрой становится целью."
  };
  var QUESTIONS = [
    {q:"Зарплата пришла. Что ты делаешь первым делом?", o:[
      ["Заказываю что-то приятное","Я же заслужила",{kerri:2}],
      ["Перевожу часть на накопительный счёт","Так спокойнее",{tyotya:2}],
      ["Открываю брокерское приложение","Посмотреть, что бы купить",{vibe:2}],
      ["Ничего: автоперевод в капитал уже сработал","Всё идёт по плану",{quiet:2}]]},
    {q:"Ты сейчас откладываешь деньги?", o:[
      ["Регулярно","С каждого дохода, это уже привычка",{tyotya:1,quiet:2}],
      ["Иногда","Когда что-то остаётся",{kerri:1,tyotya:1,vibe:1}],
      ["Пока нет","Деньги приходят и уходят",{kerri:3}]]},
    {q:"Где сейчас лежат твои накопления?", key:true, o:[
      ["Их пока почти нет","Всё уходит на жизнь",{kerri:3}],
      ["На карте или вкладе","Зато всегда под рукой",{tyotya:3}],
      ["В инвестициях, но без плана","Что-то купила, что-то держу",{vibe:3}],
      ["В инвестициях, с целью и планом","Пополняю капитал по системе",{quiet:3}]]},
    {q:"Подруга купила акции, и они выросли на 30%. Твоя первая мысль?", o:[
      ["«Скинь название, я тоже хочу»","Пока не поздно",{vibe:2}],
      ["«Здорово, но я лучше подожду»","Рынок — это как-то нервно",{tyotya:2}],
      ["«Мне бы эти 30% на отпуск»","И сразу билеты",{kerri:2}],
      ["«А какая это доля её портфеля?»","Сначала цифры, потом эмоции",{quiet:2}]]},
    {q:"Хочется что-то купить, но звучит «дорого». Что ты себе говоришь?", o:[
      ["«Живём один раз»","И покупаю",{kerri:2}],
      ["«Подожду скидку»","Спешить некуда",{tyotya:2}],
      ["«Зато это сейчас в тренде»","Потом будет поздно",{vibe:2}],
      ["«Сколько это часов моей работы?»","И решаю спокойно",{quiet:2}]]}
  ];
  var ORDER=["kerri","tyotya","vibe","quiet"];
  var answers=[];
  function computeType(){
    var sc={kerri:0,tyotya:0,vibe:0,quiet:0}, keyPick=null;
    answers.forEach(function(ai,qi){
      var w=QUESTIONS[qi].o[ai][2];
      for(var k in w){ sc[k]+=w[k]; }
      if(QUESTIONS[qi].key){ keyPick=Object.keys(w)[0]; }
    });
    var max=Math.max.apply(null,ORDER.map(function(k){return sc[k];}));
    var tied=ORDER.filter(function(k){return sc[k]===max;});
    if(tied.length>1 && keyPick && tied.indexOf(keyPick)>-1) return keyPick;
    return tied[0];
  }
  function renderQ(i){
    var q=QUESTIONS[i], n=QUESTIONS.length;
    var h='<p class="step">ВОПРОС '+(i+1)+' ИЗ '+n+'</p>'
      +'<div class="bar"><i style="width:'+Math.round((i+1)/n*100)+'%"></i></div>'
      +'<h2>'+esc(q.q)+'</h2><div class="opts">'
      +q.o.map(function(o,oi){return '<button class="opt" data-a="'+oi+'"><b>'+esc(o[0])+'</b>'+(o[1]?'<span>'+esc(o[1])+'</span>':'')+'</button>';}).join('')
      +'</div>'+(i>0?'<button class="back" data-back="1">Назад</button>':'');
    var el=document.getElementById('quiz'); el.innerHTML=h; el.setAttribute('data-i',i);
    show('quiz');
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('#start')){ answers=[]; renderQ(0); return; }
    var quiz=document.getElementById('quiz'), i=+quiz.getAttribute('data-i');
    if(e.target.closest('[data-back]')){ answers=answers.slice(0,i-1); renderQ(i-1); return; }
    var o=e.target.closest('.opt');
    if(!o || !quiz.contains(o)) return;
    answers[i]=+o.getAttribute('data-a'); answers=answers.slice(0,i+1);
    if(i+1<QUESTIONS.length) renderQ(i+1); else result();
  });
  function show(id){
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('on', s.id===id); });
    window.scrollTo(0,0);
    var h=document.querySelector('#'+id+' h1, #'+id+' h2, #'+id+' .tagline');
    if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function result(){
    var key=computeType();
    var t=TYPES[key];
    var html=''
      +'<p class="step">ТВОЙ ФИНАНСОВЫЙ ТИПАЖ</p>'
      +'<figure class="museum" style="margin-top:14px"><div class="frame"><img src="'+IMG[key]+'" alt="'+esc(t.alt)+'"></div></figure>'
      +'<div class="plaque"><small>ФИНАНСОВЫЙ ТИПАЖ</small><strong>'+esc(t.name)+'</strong></div>'
      +'<p class="tagline">'+esc(t.tag)+'</p>'
      +'<div class="card">'+t.text.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div>'
      +'<div class="card"><h3>Три первых шага</h3><ol>'+t.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol></div>'
      +'<p class="remember">И запомни: '+esc(t.remember.charAt(0).toLowerCase()+t.remember.slice(1))+'</p>'
      +'<div class="tg"><p class="t">Полное досье на твой типаж</p><p>Пошаговый план на месяц под твой типаж: какие счета открыть, как посчитать свой финансовый план и что прочитать в канале в первую очередь.</p>'
      +'<a class="btn" href="'+DOSSIER[key]+'" target="_blank" rel="noopener">Открыть досье в Telegram</a></div>'
      +'<div class="row"><a class="btn ghost" href="https://www.instagram.com/sheishedonist/" target="_blank" rel="noopener">Подписаться на @sheishedonist</a></div>'
      +'<p class="share">Сделай скрин и отметь меня в сторис — посмотрим, каких типажей больше.</p>'
      +'<button class="back" id="again">Пройти заново</button>';
    var r=document.getElementById('result'); r.innerHTML=html;
    document.getElementById('again').addEventListener('click',function(){ answers=[]; show('intro'); });
    show('result');
  }
})();
</script>
